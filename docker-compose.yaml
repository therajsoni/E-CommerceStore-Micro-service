services:
 frontend: 
  build: ./frontend
  container_name: frontend
  ports: 
    - "3000:3000"
  depends_on: 
   - api-gateway
  environment:
   -  REACT_APP_USER_SERVICE_URL=http://user-service:5000
   -  REACT_APP_PRODUCT_SERVICE_URL=http://product-service:5000
   -  REACT_APP_CART_SERVICE_URL=http://card-service:5000
   -  REACT_APP_ORDER_SERVICE_URL=http://order-service:5000
  networks:
    - app-network
 api-gateway:
  build: ./backend/api-gateway
  container_name: api-gateway
  ports:
    - "5000:5000"
  depends_on:
   - user-service 
  environment:
    - PORT=5000
    - ORDER_SERVICE=http://order-service:3004
    - CART_SERVICE=http://card-service:3003
    - PRODUCT_SERVICE=http://product-service:3002
    - AUTH_SERVICE=http://user-service:3001
  networks:
    - app-network
 user-service:
  build: ./backend/user-service
  container_name: user-service 
  ports:
   - "3001:3001"
  environment:
   - PORT=3001
   - MONGODB_URI=mongodb://localhost:27017/ecommerce_users
   - JWT_SECRET=your-jwt-secret-key
  networks: 
   - app-network
 product-service:
  build: ./backend/product-service 
  container_name: product-service 
  ports:
   - "3002:3002"
  environment:
   - PORT=3002
   - MONGODB_URI=mongodb://localhost:27017/ecommerce_products
  networks:
   - app-network 
 card-service:
  build: ./backend/cart-service
  container_name: cart-service 
  ports: 
   - "3003:3003"
  depends_on:
    - product-service
  environment:
   - PORT=3003
   - MONGODB_URI=mongodb://localhost:27017/ecommerce_carts
   - PRODUCT_SERVICE_URL=http://api-gateway:5000
  networks:
   - app-network 
 order-service:
  build: ./backend/order-service 
  container_name: order-service 
  ports:
    - "3004:3004"
  depends_on:
    - product-service
    - user-service
    - card-service
  environment: 
   - PORT=3004
   - MONGODB_URI=mongodb://localhost:27017/ecommerce_orders
   - CART_SERVICE_URL=http://api-gateway:3003
   - PRODUCT_SERVICE_URL=http://api-gateway:3002
   - USER_SERVICE_URL=http://api-gateway:3001
  networks:
    - app-network
networks: 
  app-network:  
    driver: bridge
 
